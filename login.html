<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Perros Comunitarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Usar los mismos estilos que el resto del proyecto -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth-styles.css">
    <link rel="icon" href="img/logohuella.png" type="image/png">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐾 Maps Pets</h1>
            <p></p>
        </header>

        <!-- Loading State -->
        <div id="loading" class="loading" style="color: white;">
            <p>🐕 Verificando sesión...</p>
        </div>

        <!-- Login Card -->
        <div id="loginCard" class="card login-container" style="display: none;">
            <div style="text-align: center;">
                <div class="admin-badge">👤 ADMINISTRADOR</div>
            </div>

            <h2 style="text-align: center; color: #333; margin-bottom: 10px;">Iniciar Sesión</h2>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">Acceso exclusivo para administradores</p>

            <div id="alert" class="alert"></div>

            <form id="authForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="admin@perroscomunitarios.com"
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••"
                        required 
                        autocomplete="current-password"
                        minlength="6"
                    >
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #667eea; text-decoration: none;">
                    ← Volver al inicio
                </a>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-header.js"></script>
    <script>
        // ============================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================
        const supabaseUrl = 'https://wkeqbvgqbdvcewcodday.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZXFidmdxYmR2Y2V3Y29kZGF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0MjU5ODEsImV4cCI6MjA3NTAwMTk4MX0.7Dv1ePEOBZNWDCjQGBTSvSUh3fhu27q_A1ERmxcvwaU';

        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseAnonKey);

        // ============================================
        // ELEMENTOS DEL DOM
        // ============================================
        const loading = document.getElementById('loading');
        const loginCard = document.getElementById('loginCard');
        const authForm = document.getElementById('authForm');
        const alertBox = document.getElementById('alert');
        const loginBtn = document.getElementById('loginBtn');

        // ============================================
        // FUNCIONES DE UTILIDAD
        // ============================================
        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert ${type} show`;
            setTimeout(() => {
                alertBox.className = 'alert';
            }, 5000);
        }

        function showLoading(show = true) {
            loading.style.display = show ? 'block' : 'none';
        }

        function showLogin(show = true) {
            loginCard.style.display = show ? 'block' : 'none';
        }

        // ============================================
        // VERIFICACIÓN DE SESIÓN
        // ============================================
        async function checkSession() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                showLoading(false);
                
                if (error) throw error;
                
                if (session) {
                    // Usuario ya tiene sesión activa, redirigir al dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    // No hay sesión, mostrar login
                    showLogin(true);
                }
            } catch (error) {
                console.error('Error verificando sesión:', error);
                showLoading(false);
                showLogin(true);
                showAlert('Error al verificar la sesión', 'error');
            }
        }

        // ============================================
        // MANEJO DE LOGIN
        // ============================================
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Iniciando sesión...';
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) throw error;
                
                showAlert('¡Bienvenido administrador!', 'success');
                
                setTimeout(() => {
                    // Redirigir al dashboard después del login exitoso
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Error en login:', error);
                
                if (error.message.includes('Invalid login credentials')) {
                    showAlert('❌ Credenciales incorrectas. Verifica tu email y contraseña.', 'error');
                } else if (error.message.includes('Email not confirmed')) {
                    showAlert('⚠️ Debes confirmar tu email antes de iniciar sesión.', 'error');
                } else {
                    showAlert('❌ Error al iniciar sesión: ' + error.message, 'error');
                }
                
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar Sesión';
            }
        });

        // ============================================
        // LISTENER DE CAMBIOS DE AUTENTICACIÓN
        // ============================================
        supabaseClient.auth.onAuthStateChange((event, session) => {
            console.log('Auth event:', event);
            
            if (event === 'SIGNED_IN' && session) {
                // Redirigir al dashboard
                window.location.href = 'dashboard.html';
            }
        });

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        checkSession();
    </script>
</body>
</html>
