<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Perros Comunitarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Usar los mismos estilos que el resto del proyecto -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth-styles.css">
    <link rel="icon" href="img/logohuella.png" type="image/png">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐾 Maps Pets</h1>
            <p></p>
        </header>

        <!-- Loading State -->
        <div id="loading" class="loading" style="color: white;">
            <p>🐕 Verificando sesión...</p>
        </div>

        <!-- Login Card -->
        <div id="loginCard" class="card login-container" style="display: none;">
            <div style="text-align: center;">
                <div class="admin-badge">👤 ADMINISTRADOR</div>
            </div>

            <h2 style="text-align: center; color: #333; margin-bottom: 10px;">Iniciar Sesión</h2>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">Acceso exclusivo para administradores</p>

            <div id="alert" class="alert"></div>

            <form id="authForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="admin@correo.com"
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••"
                        required 
                        autocomplete="current-password"
                        minlength="6"
                    >
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #667eea; text-decoration: none;">
                    ← Volver al inicio
                </a>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth-header.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
